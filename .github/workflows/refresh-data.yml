# Refreshes fast-changing data (advisories, exchange rates, population, price levels) weekly, on Mondays.
# Start it by hand (Actions tab, or `gh workflow run "Refresh data"`) after a big advisory change.
# The data lives in a private Cloudflare R2 bucket, not in git: pull it, refresh, test, upload the result.
# Needs repository secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_BUCKET.
name: Refresh data

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:pull
      - run: npm run data:refresh
      - run: npm test
      - run: npm run data:push
